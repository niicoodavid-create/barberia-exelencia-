.btn-danger,.btn-mini{width:100%;padding:13px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:1px;border:none;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Outfit',sans-serif}.btn-google{background:#fff;color:#050505}.btn-primary{background:linear-gradient(135deg,#c5a059,#a67c00);color:#000;box-shadow:0 5px 20px rgba(197,160,89,.25);margin-top:10px}.btn-secondary{background:#222;color:#fff;border:1px solid #444}.btn-danger{background:#d52b1e;color:#fff}.btn-mini{width:auto;padding:9px 11px;font-size:11px}.btn-primary:disabled{opacity:.6;cursor:wait}.input-group{margin-bottom:18px}.input-group label{font-size:11px;color:#c5a059;display:block;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.input-group input,.input-group select,.modal input,.modal select{width:100%;padding:12px;background:#111;border:1px solid #333;color:#fff;border-radius:10px;font-size:14px;outline:none;font-family:'Outfit',sans-serif}.input-group input:focus,.modal input:focus,.modal select:focus{border-color:#c5a059}.servicios-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-servicio{background:#111;border:2px solid #222;border-radius:11px;padding:14px 9px;color:#fff;cursor:pointer;text-align:center}.btn-servicio span{display:block;font-size:13px;font-weight:800;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}.btn-servicio small{font-size:12px;color:#c5a059;font-weight:700}.btn-servicio.seleccionado{border-color:#c5a059;background:rgba(197,160,89,.1)}.horarios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.btn-hora{padding:10px 0;min-height:62px;border-radius:8px;font-size:15px;font-weight:800;text-align:center;font-family:'Outfit',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}.btn-hora span{font-size:10px;margin-top:3px;letter-spacing:1px}.hora-disponible{background: ight:800;display:block}.day-btn .day-state{font-size:8px;margin-top:3px;display:block}.calendar-nav{display:flex;gap:8px;align-items:center}.calendar-nav button{width:40px}.calendar-title{flex:1;text-align:center;color:#c5a059;font-weight:800;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:10000;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:100%;max-width:420px;background:#121212;border:1px solid #333;border-radius:16px;padding:18px;box-shadow:0 20px 60px #000}.modal h3{color:#c5a059;margin-bottom:14px;font-size:16px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions>*{flex:1}.firma-naicky{margin-top:28px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:#555;letter-spacing:1px;user-select:none}.firma-naicky:after{content:' ®';font-family:'Outfit',sans-serif;font-size:8px;vertical-align:super;font-style:normal;letter-spacing:0}@media(max-width:480px){body{padding:0}.main-container{padding:28px 18px;border-radius:0;min-height:100vh;border:none}.marca-excelencia h1{font-size:44px}.horarios-grid{gap:7px}}

</div>

<div class="header-title"><p id="welcomeUser">Bienvenido a la Experiencia</p><div id="btnNotificaciones" class="notificaciones hidden" onclick="verNotificaciones()"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span id="badgeNoti" class="badge-noti hidden">0</span></div></div>

<div id="modalEditarTurno" class="modal-backdrop hidden"><div class="modal"><h3>Editar Turno</h3><input type="hidden" id="editarTurnoId"><div class="input-group"><label>Cliente</label><select id="editarTurnoCliente"></select></div><div class="input-group"><label>Servicio</label><select id="editarTurnoServicio"></select></div><div class="input-group"><label>Fecha</label><input id="editarTurnoFecha" type="date"></div><div class="input-group"><label>Hora</label><select id="editarTurnoHora"></select></div><div class="modal-actions"><button class="btn-secondary" onclick="cerrarModal('modalEditarTurno')">Cancelar</button><button class="btn-primary" onclick="guardarEdicionTurno()">Guardar Cambios</button></div><button class="btn-danger" style="margin-top:8px" onclick="cancelarTurnoActual()">Cancelar Turno</button></div></div>
<script>
let usuarioActual=null,servicioSeleccionadoId=null,horaSeleccionada=null,todosLosTurnos=[],diasBloqueados=[],intervaloTiempoReal=null,agendaConfirmada=false,serviciosActuales=[],clientesActuales=[],semanaCalendario=0,cantidadTurnosLeidos=Number(localStorage.getItem('turnosLeidos'))||0;
const CORREO_BARBERO='gamarramartin1995@gmail.com',HORAS_LABORALES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'],MAX_DIAS=14;
function valoresArgentina(){const p=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());return Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}
function obtenerFechaHoraArgentina(){const v=valoresArgentina();return `${v.year}-${v.month}-${v.day} ${v.hour}:${v.minute}`}
function obtenerFechaArgentina(){return obtenerFechaHoraArgentina().slice(0,10)}
function horarioYaPaso(fecha,hora){return `${fecha} ${hora}`<=obtenerFechaHoraArgentina()}
function normalizarFechaHora(v){if(typeof v!=='string')return '';const s=v.trim().replace('T',' ');const m=s.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2})/);return m?m[1]:s}
function formatoPrecio(v){return `$${Number(v).toLocaleString('es-AR')}`}
function diasEntre(d,a){return Math.floor((new Date(`${d}T00:00:00`)-new Date(`${a}T00:00:00`))/86400000)}
function esDentroVentana(fecha){const hoy=obtenerFechaArgentina(),dif=diasEntre(hoy,fecha);return dif>=0&&dif<=MAX_DIAS}
async function fetchTurnosGlobales(){try{const ts=Date.now(),[rt,rd]=await Promise.all([fetch(`/api/turnos?t=${ts}`,{cache:'no-store'}),fetch(`/api/dias-bloqueados?t=${ts}`,{cache:'no-store'})]);if(!rt.ok||!rd.ok)throw new Error('No se pudo sincronizar la agenda.');const [turnos,dias]=await Promise.all([rt.json(),rd.json()]);todosLosTurnos=Array.isArray(turnos)?turnos.map(t=>({...t,fecha_hora:normalizarFechaHora(t.fecha_hora)})):[];diasBloqueados=Array.isArray(dias)?dias:[];agendaConfirmada=true;return true}catch(e){agendaConfirmada=false;console.error(e);return false}}
async function loginTradicional(){const email=document.getElementById('emailInput').value.trim(),nombre=document.getElementById('nombreInput').value.trim();if(!email||!nombre)return alert('Por favor, completa tus credenciales.');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,nombre})});if(!r.ok)throw new Error();const d=await r.json();localStorage.setItem('usuarioActivo',JSON.stringify(d));usuarioActual=d;await fetchTurnosGlobales();mostrarDashboard(d)}catch(e){alert('Error al conectar con el servidor.')}}
async function mostrarDashboard(user){document.getElementById('loginView').classList.add('hidden');document.getElementById('dashboardView').classList.remove('hidden');const esBarbero=user.email.toLowerCase()===CORREO_BARBERO;document.getElementById('welcomeUser').innerText=esBarbero?`Maestro Autor: ${user.nombre}`:`Cliente VIP: ${user.nombre}`;document.getElementById('seccionCliente').classList.toggle('hidden',esBarbero);document.getElementById('seccionBarbero').classList.toggle('hidden',!esBarbero);document.getElementById('btnNotificaciones').classList.toggle('hidden',!esBarbero);if(esBarbero){const a=document.getElementById('fechaAgendaAdmin');a.value=a.value||obtenerFechaArgentina();document.getElementById('fechaBloqueo').min=obtenerFechaArgentina();await cargarPanelBarbero();renderCalendario()}else{const f=document.getElementById('fechaInput');f.min=obtenerFechaArgentina();f.max=fechaMasDias(14);await cargarServiciosCliente()}iniciarActualizacionTiempoReal()}
function fechaMasDias(n){const d=new Date(`${obtenerFechaArgentina()}T00:00:00`);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function cargarServiciosCliente(){try{const r=await fetch('/api/servicios',{cache:'no-store'});serviciosActuales=await r.json();renderServiciosCliente()}catch(e){console.error(e)}}
function renderServiciosCliente(){const c=document.getElementById('contenedorServicios');c.innerHTML='';serviciosActuales.forEach((s,i)=>{const b=document.createElement('div');b.className=`btn-servicio ${i===0?'seleccionado':''}`;b.innerHTML=`<span>${escapeHtml(s.nombre)}</span><small>${formatoPrecio(s.precio)}</small>`;b.onclick=()=>{document.querySelectorAll('.btn-servicio').forEach(x=>x.classList.remove('seleccionado'));b.classList.add('seleccionado');servicioSeleccionadoId=s.id};if(i===0)servicioSeleccionadoId=s.id;c.appendChild(b)})}
function cargarHorarios(){const fecha=document.getElementById('fechaInput').value,c=document.getElementById('contenedorHorarios'),g=document.getElementById('grillaHorarios');if(!fecha)return;c.style.display='block';g.innerHTML='';horaSeleccionada=null;if(!agendaConfirmada)return renderNoDisponibles('NO DISPONIBLE');if(!esDentroVentana(fecha))return renderNoDisponibles('FUERA DE AGENDA');if(diasBloqueados.includes(fecha)){g.innerHTML='<div class="fecha-bloqueada" style="grid-column:1/-1">El Maestro Barbero no atenderá este día.</div>';return}HORAS_LABORALES.forEach(h=>{const fh=`${fecha} ${h}`,ocupado=todosLosTurnos.some(t=>normalizarFechaHora(t.fecha_hora)===fh&&t.estado!=='cancelado'),vencido=horarioYaPaso(fecha,h),b=document.createElement('div');if(vencido){b.className='btn-hora hora-vencida';b.innerHTML=`${h}<span>VENCIDO</span>`}else if(ocupado){b.className='btn-hora hora-ocupada';b.innerHTML=`${h}<span>OCUPADO</span>`}else{b.className='btn-hora hora-disponible';b.innerHTML=`${h}<span>LIBRE</span>`;b.onclick=()=>{document.querySelectorAll('.btn-hora').forEach(x=>x.classList.remove('seleccionada'));b.classList.add('seleccionada');horaSeleccionada=h}}g.appendChild(b)});let i=document.getElementById('indicadorTiempoReal');if(!i){i=document.createElement('div');i.id='indicadorTiempoReal';i.className='estado-tiempo-real';c.appendChild(i)}i.innerText='● Agenda actualizada'}
function renderNoDisponibles(text){const g=document.getElementById('grillaHorarios');HORAS_LABORALES.forEach(h=>{const b=document.createElement('div');b.className='btn-hora hora-no-disponible';b.innerHTML=`${h}<span>${text}</span>`;g.appendChild(b)})}
async function reservarTurno(){const fecha=document.getElementById('fechaInput').value;if(!fecha||!horaSeleccionada||!servicioSeleccionadoId)return alert('Selecciona una fecha y un horario verde.');const b=document.getElementById('btnConfirmarReserva');b.disabled=true;b.innerText='Verificando...';try{if(!(await fetchTurnosGlobales()))throw new Error('agenda');const fh=`${fecha} ${horaSeleccionada}`;if(!esDentroVentana(fecha)||diasBloqueados.includes(fecha)||horarioYaPaso(fecha,horaSeleccionada))return alert('Ese horario ya no está disponible.');if(todosLosTurnos.some(t=>normalizarFechaHora(t.fecha_hora)===fh&&t.estado!=='cancelado')){await fetchTurnosGlobales();cargarHorarios();return alert('Ese turno ya está ocupado. Elige otro horario verde')}const r=await fetch('/api/turnos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cliente_id:usuarioActual.id,servicios_id:servicioSeleccionadoId,fecha_hora:fh})});const d=await r.json().catch(()=>({}));if(r.ok){alert('¡Reserva confirmada con éxito en Excelencia!');await fetchTurnosGlobales();cargarHorarios()}else{alert(d.error||'No se pudo reservar el turno.');await fetchTurnosGlobales();cargarHorarios()}}catch(e){alert('No se pudo verificar la agenda. Intenta nuevamente.')}finally{b.disabled=false;b.innerText='Confirmar Reserva'}}
function iniciarActualizacionTiempoReal(){clearInterval(intervaloTiempoReal);intervaloTiempoReal=setInterval(async()=>{if(!usuarioActual)return;if(await fetchTurnosGlobales()){const fc=document.getElementById('fechaInput'),sa=document.getElementById('seccionCliente');if(fc&&fc.value&&!sa.classList.contains('hidden'))cargarHorarios();const fa=document.getElementById('fechaAgendaAdmin'),sb=document.getElementById('seccionBarbero');if(fa&&fa.value&&!sb.classList.contains('hidden')){cargarAgendaBarbero();renderCalendario()}}},5000)}
async function cargarPanelBarbero(){await cargarServiciosAdmin();await cargarClientesAdmin();cargarAgendaBarbero()}
async function cargarServiciosAdmin(){const r=await fetch('/api/servicios',{cache:'no-store'});serviciosActuales=await r.json();const c=document.getElementById('listaPreciosAdmin');c.innerHTML='';serviciosActuales.forEach(s=>{const d=document.createElement('div');d.className='admin-card';d.innerHTML=`<div class="admin-row"><input id="nombreServicio_${s.id}" value="${escapeAttr(s.nombre)}"><input id="precioServicio_${s.id}" type="number" min="0" value="${Number(s.precio)}"><button class="btn-primary btn-mini" onclick="editarServicio(${s.id})">Guardar</button></div>`;c.appendChild(d)})}
async function cargarClientesAdmin(){try{const r=await fetch('/api/clientes',{cache:'no-store'});clientesActuales=await r.json()}catch(e){clientesActuales=[]}}
function cargarAgendaBarbero(){const fecha=document.getElementById('fechaAgendaAdmin').value,c=document.getElementById('listaTurnosAdmin'),r=document.getElementById('resumenAgenda');if(!fecha){c.innerHTML='';return}let libres=0,ocupados=0,vencidos=0,html='';if(diasBloqueados.includes(fecha)){r.innerHTML='';c.innerHTML='<div class="fecha-bloqueada">Día bloqueado. No se pueden tomar turnos.</div>';return}HORAS_LABORALES.forEach(h=>{const fh=`${fecha} ${h}`,t=todosLosTurnos.find(x=>normalizarFechaHora(x.fecha_hora)===fh&&x.estado!=='cancelado'),v=horarioYaPaso(fecha,h);if(t){ocupados++;html+=`<div class="admin-card"><div class="admin-card-head"><div><div class="admin-card-title">${h} · OCUPADO</div><div class="admin-card-meta">${escapeHtml(t.cliente||'Cliente')} · ${escapeHtml(t.servicio||'Servicio')}</div></div><button class="btn-primary btn-mini" onclick="abrirEditarTurno(${t.id})">Editar</button></div><div class="admin-actions"><button class="btn-danger btn-mini" onclick="cancelarTurno(${t.id})">Cancelar</button></div></div>`}else if(v){vencidos++;html+=`<div class="admin-card"><div class="admin-card-title" style="color:#ff4d4d">${h} · VENCIDO</div></div>`}else{libres++;html+=`<div class="admin-card"><div class="admin-card-head"><div><div class="admin-card-title" style="color:#2ecc71">${h} · LIBRE</div></div><button class="btn-primary btn-mini" onclick="abrirModalTurno('${fecha}','${h}')">+</button></div></div>`}});r.innerHTML=`<div class="btn-secondary btn-mini">🟩 ${libres}</div><div class="btn-danger btn-mini">🟥 ${ocupados}</div><div class="btn-secondary btn-mini">⏱ ${vencidos}</div>`;c.innerHTML=html}
function renderCalendario(){const c=document.getElementById('calendarioDias'),t=document.getElementById('tituloCalendario');if(!c||!t)return;const base=new Date(`${obtenerFechaArgentina()}T00:00:00`);base.setDate(base.getDate()+semanaCalendario*7);t.innerText=`${base.toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}`;c.innerHTML='';['L','M','X','J','V','S','D'].forEach(d=>{const h=document.createElement('div');h.className='day-head';h.innerText=d;c.appendChild(h)});const lunes=new Date(base),diaSemana=(lunes.getDay()+6)%7;lunes.setDate(lunes.getDate()-diaSemana);for(let i=0;i<7;i++){const d=new Date(lunes);d.setDate(lunes.getDate()+i);const f=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,dif=diasEntre(obtenerFechaArgentina(),f),b=document.createElement('button'),bloqueado=diasBloqueados.includes(f),pasado=dif<0||dif>MAX_DIAS;b.className=`day-btn ${bloqueado?'blocked':'available'} ${pasado?'past':''}`;b.innerHTML=`<span class="day-num">${d.getDate()}</span><span class="day-state">${pasado?'FUERA':bloqueado?'BLOQ':'DISP'}</span>`;if(!pasado)b.onclick=()=>{document.getElementById('fechaAgendaAdmin').value=f;document.getElementById('fechaBloqueo').value=f;cargarAgendaBarbero();renderCalendario()};c.appendChild(b)}}
function cambiarSemana(n){const next=semanaCalendario+n;if(next<-1||next>1)return;semanaCalendario=next;renderCalendario()}
async function bloquearDia(){const f=document.getElementById('fechaBloqueo').value;if(!f)return alert('Selecciona una fecha.');if(!esDentroVentana(f))return alert('Solo puedes organizar los próximos 14 días.');try{const r=await fetch('/api/dias-bloqueados',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fecha:f})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo bloquear');await fetchTurnosGlobales();document.getElementById('fechaAgendaAdmin').value=f;cargarAgendaBarbero();renderCalendario()}catch(e){alert(e.message)}}
async function desbloquearDiaSeleccionado(){const f=document.getElementById('fechaBloqueo').value;if(!f)return alert('Selecciona una fecha.');try{const r=await fetch(`/api/dias-bloqueados/${encodeURIComponent(f)}`,{method:'DELETE'});if(!r.ok)throw new Error();await fetchTurnosGlobales();renderCalendario();cargarAgendaBarbero()}catch(e){alert('El servidor todavía debe habilitar la función de desbloqueo.')}}
function abrirModalServicio(id=null){document.getElementById('tituloModalServicio').innerText=id?'Editar Servicio':'Agregar Servicio';document.getElementById('modalServicio').dataset.id=id||'';document.getElementById('servicioNombreInput').value=id?(serviciosActuales.find(s=>s.id===id)||{}).nombre||'':'';document.getElementById('servicioPrecioInput').value=id?(serviciosActuales.find(s=>s.id===id)||{}).precio||'':'';document.getElementById('modalServicio').classList.remove('hidden')}
function cerrarModal(id){document.getElementById(id).classList.add('hidden')}
async function guardarServicio(){const m=document.getElementById('modalServicio'),id=m.dataset.id,nombre=document.getElementById('servicioNombreInput').value.trim(),precio=document.getElementById('servicioPrecioInput').value;if(!nombre||precio==='')return alert('Completa nombre y precio.');try{const r=await fetch(id?`/api/servicios/${id}`:'/api/servicios',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,precio})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo guardar el servicio.');cerrarModal('modalServicio');await cargarPanelBarbero()}catch(e){alert(e.message)}}
async function editarServicio(id){const nombre=document.getElementById(`nombreServicio_${id}`).value.trim(),precio=document.getElementById(`precioServicio_${id}`).value;if(!nombre||precio==='')return alert('Completa los datos.');try{const r=await fetch(`/api/servicios/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,precio})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo actualizar.');await cargarServiciosAdmin()}catch(e){alert(e.message)}}
async function prepararModales(){document.getElementById('turnoClienteInput').innerHTML=clientesActuales.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)} - ${escapeHtml(c.email||'')}</option>`).join('');document.getElementById('turnoServicioInput').innerHTML=serviciosActuales.map(s=>`<option value="${s.id}">${escapeHtml(s.nombre)} - ${formatoPrecio(s.precio)}</option>`).join('');const h=document.getElementById('turnoHoraInput');h.innerHTML=HORAS_LABORALES.map(x=>`<option>${x}</option>`).join('');const eh=document.getElementById('editarTurnoHora');eh.innerHTML=h.innerHTML;document.getElementById('editarTurnoCliente').innerHTML=document.getElementById('turnoClienteInput').innerHTML;document.getElementById('editarTurnoServicio').innerHTML=document.getElementById('turnoServicioInput').innerHTML}
async function abrirModalTurno(fecha,hora){await prepararModales();document.getElementById('turnoFechaInput').value=fecha;document.getElementById('turnoHoraInput').value=hora;document.getElementById('modalTurno').classList.remove('hidden')}
async function guardarTurnoAdmin(){const payload={cliente_id:document.getElementById('turnoClienteInput').value,servicios_id:document.getElementById('turnoServicioInput').value,fecha_hora:`${document.getElementById('turnoFechaInput').value} ${document.getElementById('turnoHoraInput').value}`};try{const r=await fetch('/api/turnos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo agregar el turno.');cerrarModal('modalTurno');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
async function abrirEditarTurno(id){const t=todosLosTurnos.find(x=>x.id===id);if(!t)return;await prepararModales();document.getElementById('editarTurnoId').value=id;document.getElementById('editarTurnoCliente').value=t.clientes_id;document.getElementById('editarTurnoServicio').value=t.servicios_id;document.getElementById('editarTurnoFecha').value=normalizarFechaHora(t.fecha_hora).slice(0,10);document.getElementById('editarTurnoHora').value=normalizarFechaHora(t.fecha_hora).slice(11,16);document.getElementById('modalEditarTurno').classList.remove('hidden')}
async function guardarEdicionTurno(){const id=document.getElementById('editarTurnoId').value,payload={cliente_id:document.getElementById('editarTurnoCliente').value,servicios_id:document.getElementById('editarTurnoServicio').value,fecha_hora:`${document.getElementById('editarTurnoFecha').value} ${document.getElementById('editarTurnoHora').value}`};try{const r=await fetch(`/api/turnos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'El servidor todavía debe habilitar la edición.');cerrarModal('modalEditarTurno');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
async function cancelarTurno(id){if(!confirm('¿Cancelar este turno?'))return;try{const r=await fetch(`/api/turnos/${id}`,{method:'DELETE'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo cancelar.');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
async function cancelarTurnoActual(){await cancelarTurno(Number(document.getElementById('editarTurnoId').value));cerrarModal('modalEditarTurno')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function escapeAttr(v){return escapeHtml(v)}
function revisarNotificaciones(){const n=todosLosTurnos.length-cantidadTurnosLeidos,b=document.getElementById('badgeNoti');if(n>0){b.innerText=n;b.classList.remove('hidden')}}
function verNotificaciones(){cantidadTurnosLeidos=todosLosTurnos.length;localStorage.setItem('turnosLeidos',cantidadTurnosLeidos);document.getElementById('badgeNoti').classList.add('hidden');alert('¡Agenda revisada!')}
function cerrarSesion(){clearInterval(intervaloTiempoReal);localStorage.removeItem('usuarioActivo');location.reload()}
document.getElementById('fechaInput').addEventListener('change',cargarHorarios);
window.onload=async()=>{const hoy=obtenerFechaArgentina();document.getElementById('fechaInput').min=hoy;document.getElementById('fechaInput').max=fechaMasDias(14);document.getElementById('fechaBloqueo').min=hoy;const u=localStorage.getItem('usuarioActivo');if(u)try{usuarioActual=JSON.parse(u);await fetchTurnosGlobales();await mostrarDashboard(usuarioActual)}catch(e){console.error(e)}};
</script>
</body>
