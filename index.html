<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excelencia - Barbería de Autor by Martín G</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050505'/><path d='M40 20h20v60H40z' fill='%23fff'/><path d='M50 20h10v60H50z' fill='%230033a0'/><path d='M30 20h10v60H30z' fill='%23d52b1e'/><text x='50' y='62' font-family='serif' font-size='42' font-weight='bold' fill='%23c5a059' text-anchor='middle'>E</text></svg>">
    
    <!-- Fuentes Profesionales 2026 -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%);
            color: #f4f4f4;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* MARCO TRICOLOR ANIMADO */
        @keyframes marcoMovement {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .marco-tricolor {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            border: 6px solid transparent;
            background: linear-gradient(135deg, #0033a0, #ffffff, #d52b1e, #ffffff, #0033a0);
            background-size: 300% 300%;
            animation: marcoMovement 8s ease infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.9;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .header-title { text-align: center; margin-bottom: 25px; position: relative; }
        .header-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            color: #c5a059;
            line-height: 1.1;
            margin-bottom: 5px;
            text-shadow: 0 4px 15px rgba(197,160,89,0.25);
        }
        .header-title p {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .notificaciones {
            position: absolute;
            top: 5px; right: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .notificaciones:hover { transform: scale(1.1); }
        .notificaciones svg { fill: #c5a059; width: 26px; height: 26px; }
        .badge-noti {
            position: absolute; top: -4px; right: -4px;
            background: #d52b1e; color: #fff;
            font-size: 10px; font-weight: bold;
            width: 16px; height: 16px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-social, .btn-primary {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-family: 'Outfit', sans-serif;
        }
        .btn-google { background: #fff; color: #050505; }
        .btn-google:active { transform: scale(0.97); }
        
        .btn-primary {
            background: linear-gradient(135deg, #c5a059 0%, #a67c00 100%);
            color: #000;
            box-shadow: 0 5px 20px rgba(197,160,89,0.3);
            margin-top: 10px;
        }
        .btn-primary:active { transform: scale(0.97); }

        .input-group { margin-bottom: 20px; }
        .input-group label {
            font-size: 12px;
            color: #c5a059;
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            font-family: 'Outfit', sans-serif;
            transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: #c5a059; }

        .servicios-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-servicio {
            background: #111;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 16px 10px;
            color: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }
        .btn-servicio span { display: block; font-size: 14px; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .btn-servicio small { font-size: 13px; color: #aaa; font-weight: 600; }
        .btn-servicio.seleccionado {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.1);
        }
        .btn-servicio.seleccionado small { color: #c5a059; }

        /* HORARIOS (GRILLA DE TURNOS CLIENTE) - COLORES CORREGIDOS */
        .horarios-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .btn-hora {
            padding: 12px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .hora-disponible { 
            background: rgba(46, 204, 113, 0.15); 
            color: #2ecc71; 
            border: 2px solid #2ecc71; 
        }
        .hora-disponible:hover, .hora-disponible.seleccionada { 
            background: #2ecc71; 
            color: #000; 
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }
        /* Las letras "LIBRE" cambian a negro cuando se selecciona el botón */
        .hora-disponible.seleccionada span { color: #000 !important; font-weight: 800; }
        .hora-disponible:hover span { color: #000 !important; }

        .hora-ocupada { 
            background: rgba(213, 43, 30, 0.15); 
            color: #ff4d4d; 
            border: 2px solid #d52b1e; 
            text-decoration: line-through; 
            cursor: not-allowed; 
            pointer-events: none; 
        }
        
        .admin-section { background: #111; padding: 20px; border-radius: 16px; border-top: 3px solid #c5a059; margin-bottom: 20px; }
        .hidden { display: none !important; }

        .divisor { margin: 25px 0; border-top: 1px solid #333; position: relative; text-align: center; }
        .divisor span { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); background: #151515; padding: 0 15px; color: #888; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;}

        .firma-naicky {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            color: #555;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .main-container { padding: 30px 20px; border-radius: 0; min-height: 100vh; border: none; }
            body { padding: 0; }
        }
    </style>
</head>
<body>

    <div class="marco-tricolor"></div>

    <div class="main-container">
        <!-- VISTA LOGIN -->
        <div id="loginView">
            <div class="header-title">
                <h1>Excelencia</h1>
                <p>Barbería de Autor</p>
            </div>

            <button class="btn-social btn-google" onclick="window.location.href='/auth/google'">
                <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Ingresar con Google
            </button>

            <div class="divisor"><span>o registro manual</span></div>
            <div class="input-group"><input type="email" id="emailInput" placeholder="Tu correo electrónico"></div>
            <div class="input-group"><input type="text" id="nombreInput" placeholder="Tu nombre completo"></div>
            <button class="btn-primary" onclick="loginTradicional()">Acceder al Salón</button>
        </div>

        <!-- VISTA PANEL GENERAL -->
        <div id="dashboardView" class="hidden">
            <div class="header-title" style="margin-bottom: 15px;">
                <h1 style="font-size: 38px;">Excelencia</h1>
                <p id="welcomeUser" style="color:#c5a059;">Bienvenido a la Experiencia</p>
                
                <div id="btnNotificaciones" class="notificaciones hidden" onclick="verNotificaciones()">
                    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
                    <span id="badgeNoti" class="badge-noti hidden">0</span>
                </div>
            </div>

            <!-- SECCIÓN CLIENTE (TURNOS) -->
            <div id="seccionCliente">
                <div class="input-group">
                    <label>1. Selecciona tu Estilo</label>
                    <div id="contenedorServicios" class="servicios-grid"></div>
                </div>

                <div class="input-group">
                    <label>2. Elige el Día</label>
                    <input type="date" id="fechaInput" onchange="cargarHorarios()" style="text-transform: uppercase;">
                </div>

                <div class="input-group" id="contenedorHorarios" style="display:none;">
                    <label>3. Selecciona una hora Libre (Verde)</label>
                    <div id="grillaHorarios" class="horarios-grid"></div>
                </div>

                <button class="btn-primary" onclick="reservarTurno()" style="margin-top:20px;">Confirmar Reserva</button>
            </div>

            <!-- SECCIÓN BARBERO ADMIN -->
            <div id="seccionBarbero" class="hidden">
                <div class="admin-section">
                    <label style="color:#c5a059; font-size:14px; display:block; margin-bottom:10px; font-weight:800; letter-spacing:1px;">GESTIÓN DE PRECIOS</label>
                    <div id="listaPreciosAdmin" style="display:flex; flex-direction:column; gap:10px;"></div>
                </div>
                
                <div class="admin-section">
                    <label style="color:#c5a059; font-size:14px; display:block; font-weight:800; letter-spacing:1px; margin-bottom:5px;">AGENDA DETALLADA</label>
                    <p style="font-size:11px; color:#aaa; margin-bottom:12px;">Revisa las horas Libres (Verde) y Ocupadas (Rojo) de cualquier día.</p>
                    <input type="date" id="fechaAgendaAdmin" onchange="cargarAgendaBarbero()" style="width:100%; padding:12px; border-radius:8px; border:none; background:#222; color:#fff; font-family:'Outfit'; text-transform:uppercase; margin-bottom:15px;">
                    
                    <!-- Resumen Numérico (Verdes y Rojos) -->
                    <div id="resumenAgenda" style="display:flex; gap:10px; margin-bottom:15px;"></div>
                    
                    <!-- Lista Completa de Horarios para el Barbero -->
                    <div id="listaTurnosAdmin" style="display:flex; flex-direction:column; gap:10px;"></div>
                </div>

                <div class="admin-section" style="border-top: 3px solid #d52b1e;">
                    <label style="color:#d52b1e; font-size:14px; font-weight:800; letter-spacing:1px;">BLOQUEAR UN DÍA</label>
                    <p style="font-size:11px; color:#888; margin-bottom:10px; margin-top:5px;">Inhabilita todo el salón para que ningún cliente reserve en esta fecha.</p>
                    <input type="date" id="fechaBloqueo" style="width:100%; padding:12px; border-radius:8px; border:none; margin-bottom:12px; background:#222; color:#fff; font-family:'Outfit';">
                    <button class="btn-primary" style="background:#d52b1e; box-shadow:none; padding:12px;" onclick="bloquearDia()">Inhabilitar Día Seleccionado</button>
                </div>
            </div>

            <button onclick="cerrarSesion()" style="width:100%; background:transparent; border:1px solid #444; color:#888; padding:12px; border-radius:12px; margin-top:15px; cursor:pointer; font-family:'Outfit'; font-weight:600; text-transform:uppercase; letter-spacing:1px;">Cerrar Sesión Segura</button>
        </div>

        <div class="firma-naicky">by naicky</div>
    </div>

    <script>
        let usuarioActual = null;
        let servicioSeleccionadoId = null;
        let horaSeleccionada = null;
        let todosLosTurnos = [];
        let diasBloqueados = []; 
        let cantidadTurnosLeidos = localStorage.getItem('turnosLeidos') || 0;
        
        const CORREO_BARBERO = "gamarramartin1995@gmail.com";
        const HORAS_LABORALES = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];

        window.onload = async function() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaInput').setAttribute('min', hoy);
            document.getElementById('fechaBloqueo').setAttribute('min', hoy);

            const userStored = localStorage.getItem('usuarioActivo');
            if (userStored) {
                usuarioActual = JSON.parse(userStored);
                await fetchTurnosGlobales();
                mostrarDashboard(usuarioActual);
            }
        };

        async function fetchTurnosGlobales() {
            try {
                const ts = new Date().getTime();
                const resTurnos = await fetch(`/api/turnos?t=${ts}`);
                todosLosTurnos = await resTurnos.json();
                
                const resDias = await fetch(`/api/dias-bloqueados?t=${ts}`);
                diasBloqueados = await resDias.json();
            } catch (err) { console.error("Error conectando a la Barbería"); }
        }

        async function loginTradicional() {
            const email = document.getElementById('emailInput').value.trim();
            const nombre = document.getElementById('nombreInput').value.trim();
            if (!email || !nombre) { alert("Por favor, completa tus credenciales."); return; }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, nombre })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('usuarioActivo', JSON.stringify(data));
                    usuarioActual = data;
                    await fetchTurnosGlobales();
                    mostrarDashboard(data);
                }
            } catch (err) { alert("Error al conectar con el servidor."); }
        }

        async function mostrarDashboard(user) {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            
            const esBarbero = user.email.toLowerCase() === CORREO_BARBERO;
            
            if (esBarbero) {
                document.getElementById('welcomeUser').innerText = `Maestro Autor: ${user.nombre}`;
                document.getElementById('seccionCliente').classList.add('hidden');
                document.getElementById('seccionBarbero').classList.remove('hidden');
                document.getElementById('btnNotificaciones').classList.remove('hidden');
                
                const adminInput = document.getElementById('fechaAgendaAdmin');
                if (!adminInput.value) {
                    adminInput.value = new Date().toISOString().split('T')[0];
                }
                cargarPanelBarbero();
                revisarNotificaciones();
            } else {
                document.getElementById('welcomeUser').innerText = `Cliente VIP: ${user.nombre}`;
                document.getElementById('seccionCliente').classList.remove('hidden');
                document.getElementById('seccionBarbero').classList.add('hidden');
                cargarServiciosCliente();
            }
        }

        async function cargarServiciosCliente() {
            const res = await fetch('/api/servicios');
            const servicios = await res.json();
            const contenedor = document.getElementById('contenedorServicios');
            contenedor.innerHTML = '';
            
            servicios.forEach((s, index) => {
                const btn = document.createElement('div');
                btn.className = `btn-servicio ${index === 0 ? 'seleccionado' : ''}`;
                if (index === 0) servicioSeleccionadoId = s.id;
                btn.innerHTML = `<span>${s.nombre}</span><small>$${Number(s.precio).toLocaleString()}</small>`;
                btn.onclick = () => {
                    document.querySelectorAll('.btn-servicio').forEach(b => b.classList.remove('seleccionado'));
                    btn.classList.add('seleccionado');
                    servicioSeleccionadoId = s.id;
                };
                contenedor.appendChild(btn);
            });
        }

        function cargarHorarios() {
            const fecha = document.getElementById('fechaInput').value;
            if (!fecha) return;

            document.getElementById('contenedorHorarios').style.display = 'block';
            const grilla = document.getElementById('grillaHorarios');
            grilla.innerHTML = '';
            horaSeleccionada = null;

            if (diasBloqueados.includes(fecha)) {
                grilla.innerHTML = '<div style="grid-column: span 3; text-align:center; color:#ff4d4d; font-size:14px; font-weight:bold; padding:20px 0; border: 1px solid #d52b1e; border-radius: 8px; background: rgba(213, 43, 30, 0.1);">El Maestro Barbero no atenderá este día.</div>';
                return;
            }

            HORAS_LABORALES.forEach(hora => {
                const fechaHoraExacta = `${fecha} ${hora}`;
                const estaOcupado = todosLosTurnos.some(t => t.fecha_hora === fechaHoraExacta);

                const btn = document.createElement('div');
                
                if (estaOcupado) {
                    btn.className = 'btn-hora hora-ocupada';
                    btn.innerHTML = `${hora}<br><span style="font-size:11px; color:#ff4d4d; margin-top:2px; letter-spacing:1px;">OCUPADO</span>`;
                } else {
                    btn.className = 'btn-hora hora-disponible';
                    btn.innerHTML = `${hora}<br><span style="font-size:11px; color:#2ecc71; margin-top:2px; letter-spacing:1px; font-weight:800;">LIBRE</span>`;
                    
                    btn.onclick = () => {
                        document.querySelectorAll('.btn-hora').forEach(b => b.classList.remove('seleccionada'));
                        btn.classList.add('seleccionada');
                        horaSeleccionada = hora;
                    };
                }
                grilla.appendChild(btn);
            });
        }

        async function reservarTurno() {
            const fecha = document.getElementById('fechaInput').value;
            if (!fecha || !horaSeleccionada || !servicioSeleccionadoId) {
                alert("Por favor, selecciona una fecha y toca un horario Libre (Verde).");
                return;
            }

            const fechaHora = `${fecha} ${horaSeleccionada}`;
            const botonReserva = document.querySelector('.btn-primary');
            botonReserva.innerText = "Confirmando...";

            try {
                const res = await fetch('/api/turnos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cliente_id: usuarioActual.id,
                        servicios_id: servicioSeleccionadoId,
                        fecha_hora: fechaHora
                    })
                });
                
                if (res.ok) {
                    alert("¡Reserva confirmada con Éxito en Excelencia!");
                    
                    // Inyectamos el turno manualmente para que se ponga rojo INSTANTÁNEAMENTE en pantalla
                    todosLosTurnos.push({ fecha_hora: fechaHora, cliente: usuarioActual.nombre });
                    cargarHorarios(); 
                    
                    // Luego sincronizamos en segundo plano
                    fetchTurnosGlobales();
                } else {
                    alert("Lo sentimos, este turno acaba de ser tomado. Elige otro horario verde.");
                }
            } catch (err) { alert("Error de red. Intenta nuevamente."); }
            
            botonReserva.innerText = "Confirmar Reserva";
        }

        /* --- FUNCIONES EXCLUSIVAS DEL BARBERO --- */
        async function cargarPanelBarbero() {
            const res = await fetch('/api/servicios');
            const servicios = await res.json();
            const contPrecios = document.getElementById('listaPreciosAdmin');
            contPrecios.innerHTML = '';

            servicios.forEach(s => {
                contPrecios.innerHTML += `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span style="flex:1; font-size:13px; font-weight:800; text-transform:uppercase;">${s.nombre}</span>
                        <input type="number" id="precio_${s.id}" value="${s.precio}" style="width:85px; padding:8px; border-radius:6px; border:none; background:#222; color:#c5a059; font-weight:bold; font-family:'Outfit';">
                        <button onclick="guardarPrecio(${s.id})" style="padding:8px 12px; background:#c5a059; border:none; border-radius:6px; font-weight:bold; color:#000; cursor:pointer;">OK</button>
                    </div>`;
            });

            cargarAgendaBarbero();
        }

        function cargarAgendaBarbero() {
            const fecha = document.getElementById('fechaAgendaAdmin').value;
            const contResumen = document.getElementById('resumenAgenda');
            const contTurnos = document.getElementById('listaTurnosAdmin');

            if (!fecha) {
                contTurnos.innerHTML = "<p style='color:#777; font-size:13px;'>Selecciona una fecha arriba.</p>";
                return;
            }

            if (diasBloqueados.includes(fecha)) {
                contResumen.innerHTML = "";
                contTurnos.innerHTML = `<div style="text-align:center; padding:15px; color:#ff4d4d; border:1px solid #d52b1e; border-radius:8px; background: rgba(213, 43, 30, 0.1); font-weight:bold;">¡Atención! Has bloqueado este día por completo.</div>`;
                return;
            }

            let ocupados = 0;
            let libres = 0;
            let htmlAgenda = "";

            HORAS_LABORALES.forEach(hora => {
                const fechaHoraExacta = `${fecha} ${hora}`;
                const turnoExistente = todosLosTurnos.find(t => t.fecha_hora === fechaHoraExacta);

                if (turnoExistente) {
                    ocupados++;
                    htmlAgenda += `
                        <div style="background:rgba(213, 43, 30, 0.1); border-left:4px solid #d52b1e; padding:12px; border-radius:8px;">
                            <span style="color:#ff4d4d; font-weight:800; font-size:15px;">${hora} - OCUPADO</span><br>
                            <span style="color:#fff; font-size:15px; font-weight:600; display:block; margin-top:4px;">👤 Cliente: ${turnoExistente.cliente}</span>
                            <span style="color:#c5a059; font-size:13px; font-weight:bold;">✂️ Servicio: ${turnoExistente.servicio}</span>
                        </div>
                    `;
                } else {
                    libres++;
                    htmlAgenda += `
                        <div style="background:rgba(46, 204, 113, 0.05); border-left:4px solid #2ecc71; padding:12px; border-radius:8px;">
                            <span style="color:#2ecc71; font-weight:800; font-size:15px;">${hora} - LIBRE (Disponible)</span>
                        </div>
                    `;
                }
            });

            contResumen.innerHTML = `
                <div style="flex:1; background:rgba(46, 204, 113, 0.15); color:#2ecc71; text-align:center; padding:10px; border-radius:8px; font-weight:800; font-size:14px; border:2px solid #2ecc71;">🟩 ${libres} LIBRES</div>
                <div style="flex:1; background:rgba(213, 43, 30, 0.15); color:#ff4d4d; text-align:center; padding:10px; border-radius:8px; font-weight:800; font-size:14px; border:2px solid #d52b1e;">🟥 ${ocupados} OCUPADOS</div>
            `;
            
            contTurnos.innerHTML = htmlAgenda;
        }

        async function guardarPrecio(id) {
            const val = document.getElementById(`precio_${id}`).value;
            await fetch(`/api/servicios/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ precio: val })
            });
            alert("Precio guardado.");
        }

        async function bloquearDia() {
            const fecha = document.getElementById('fechaBloqueo').value;
            if (!fecha) { alert("Primero selecciona una fecha."); return; }
            
            try {
                await fetch('/api/dias-bloqueados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fecha: fecha })
                });
                alert(`Has INHABILITADO el día ${fecha}.`);
                await fetchTurnosGlobales(); 
                cargarAgendaBarbero();
            } catch (err) {
                alert("Fallo al bloquear.");
            }
        }

        function revisarNotificaciones() {
            const turnosActuales = todosLosTurnos.length;
            const nuevos = turnosActuales - cantidadTurnosLeidos;
            if (nuevos > 0) {
                document.getElementById('badgeNoti').innerText = nuevos;
                document.getElementById('badgeNoti').classList.remove('hidden');
            }
        }

        function verNotificaciones() {
            cantidadTurnosLeidos = todosLosTurnos.length;
            localStorage.setItem('turnosLeidos', cantidadTurnosLeidos);
            document.getElementById('badgeNoti').classList.add('hidden');
            alert("¡Agenda revisada!");
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioActivo');
            window.location.reload();
        }
    </script>
</body>
</html>
