*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{background:radial-gradient(circle at top,#1a1a1a 0%,#050505 100%);color:#f4f4f4;font-family:'UnifrakturMaguntia',cursive;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px;overflow-x:hidden}.marco-tricolor{position:fixed;inset:0;pointer-events:none;z-index:9999;border:6px solid transparent;background:linear-gradient(135deg,#3158a8,#f4f4f4,#bd4a43,#f4f4f4,#3158a8);background-size:300% 300%;animation:marco 8s ease infinite;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8}@keyframes marco{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}.main-container{width:100%;max-width:520px;background:rgba(13,13,13,.97);border:1px solid rgba(197,160,89,.2);border-radius:24px;padding:28px 22px;box-shadow:0 20px 50px #000;z-index:10}.marca-excelencia{text-align:center;margin-bottom:24px}.marca-excelencia h1{font-family:'UnifrakturMaguntia',cursive;font-size:56px;color:#c5a059;line-height:1;text-shadow:0 4px 15px rgba(197,160,89,.2)}.subtitulo{font-size:22px;color:#aaa;letter-spacing:1px}.direccion-salon{margin-top:4px;color:#888;letter-spacing:1px;font-size:19px}.header-title{text-align:center;margin-bottom:20px;position:relative}.header-title p{font-size:20px;color:#c5a059;letter-spacing:1px}.notificaciones{position:absolute;top:0;right:0;cursor:pointer}.notificaciones svg{fill:#c5a059;width:26px;height:26px}.badge-noti{position:absolute;top:-4px;right:-4px;background:#bd4a43;color:#fff;font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}.hidden{display:none!important}.btn-social,.btn-primary,.btn-secondary,.btn-danger,.btn-mini{width:100%;padding:13px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;transition:.2s;letter-spacing:1px;border:none;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'UnifrakturMaguntia',cursive}.btn-google{background:#fff;color:#050505}.btn-primary{background:linear-gradient(135deg,#c5a059,#a67c00);color:#000}.btn-secondary{background:#222;color:#fff;border:1px solid #444}.btn-danger{background:#b6423b;color:#fff}.btn-mini{width:auto;padding:9px 11px;font-size:13px}.btn-primary:disabled{opacity:.6;cursor:wait}.input-group{margin-bottom:18px}.input-group label{font-size:17px;color:#c5a059;display:block;margin-bottom:8px;letter-spacing:1px}.input-group input,.input-group select,.modal input,.modal select{width:100%;padding:12px;background:#111;border:1px solid #333;color:#fff;border-radius:10px;font-size:15px;outline:none;font-family:'UnifrakturMaguntia',cursive}.servicios-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-servicio{background:#111;border:2px solid #222;border-radius:11px;padding:14px 9px;color:#fff;cursor:pointer;text-align:center}.btn-servicio span{display:block;font-size:18px;margin-bottom:4px}.btn-servicio small{font-size:15px;color:#c5a059}.btn-servicio.seleccionado{border-color:#c5a059;background:rgba(197,160,89,.1)}.horarios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.btn-hora{padding:10px 0;min-height:62px;border-radius:8px;font-size:18px;text-align:center;font-family:'UnifrakturMaguntia',cursive;display:flex;flex-direction:column;align-items:center;justify-content:center}.btn-hora span{font-size:12px;margin-top:3px}.hora-disponible{background:rgba(46,204,113,.15);color:#42d37f;border:2px solid #42d37f;cursor:pointer}.hora-disponible:hover,.hora-disponible.seleccionada{background:#42d37f;color:#000}.hora-ocupada,.hora-vencida,.hora-no-disponible{background:rgba(189,74,67,.12);color:#e46860;border:2px solid #b6423b;cursor:not-allowed;pointer-events:none;opacity:.88}.hora-vencida{opacity:.55}.fecha-bloqueada{background:rgba(189,74,67,.08);border:1px solid #b6423b;border-radius:10px;padding:16px;color:#e46860;text-align:center;font-size:18px}.estado-tiempo-real{text-align:center;font-size:12px;color:#666;margin-top:8px}.admin-section{background:#111;padding:16px;border-radius:14px;border-top:3px solid #c5a059;margin-bottom:16px}.admin-section h3{font-size:19px;color:#c5a059;margin-bottom:12px;letter-spacing:1px}.admin-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.admin-row input{flex:1}.admin-card{background:#181818;border:1px solid #2d2d2d;border-radius:10px;padding:11px;margin-bottom:8px}.admin-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.admin-card-title{font-size:17px}.admin-card-meta{font-size:14px;color:#aaa;margin-top:4px}.admin-actions{display:flex;gap:6px;margin-top:8px}.calendar-box{border:2px solid transparent;border-radius:18px;padding:10px;background:linear-gradient(#101010,#101010) padding-box,linear-gradient(135deg,#3158a8,#f4f4f4,#bd4a43,#f4f4f4,#3158a8) border-box;background-size:300% 300%;animation:marco 8s ease infinite}.calendar-title{text-align:center;color:#c5a059;font-size:22px;margin-bottom:10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day-head{font-size:13px;color:#888;text-align:center}.day-btn{min-height:55px;border-radius:9px;background:#141414;color:#fff;border:1px solid #2c2c2c;font-family:'UnifrakturMaguntia',cursive;cursor:pointer}.day-btn.available{border-color:#42d37f;color:#42d37f}.day-btn.blocked{border-color:#b6423b;color:#e46860;background:rgba(189,74,67,.1)}.day-btn.selected{box-shadow:0 0 10px rgba(197,160,89,.4);border-color:#c5a059!important}.day-num{display:block;font-size:20px}.day-state{display:block;font-size:10px;margin-top:2px}.day-name{display:block;font-size:11px;color:#888}.calendar-legend{display:flex;justify-content:center;gap:14px;font-size:14px;color:#888;margin-top:9px}.calendar-legend span:first-child{color:#42d37f}.calendar-legend span:last-child{color:#e46860}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:10000;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:100%;max-width:420px;background:#121212;border:1px solid #333;border-radius:16px;padding:18px;box-shadow:0 20px 60px #000}.modal h3{color:#c5a059;margin-bottom:14px;font-size:21px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions>*{flex:1}.firma-naicky{margin-top:28px;text-align:center;font-family:'UnifrakturMaguntia',cursive;font-style:normal;font-size:24px;color:#555;letter-spacing:1px}.firma-naicky:after{content:' ®';font-size:8px;vertical-align:super}@media(max-width:480px){body{padding:0}.main-container{padding:26px 17px;border-radius:0;min-height:100vh;border:none}.marca-excelencia h1{font-size:48px}.subtitulo{font-size:20px}.direccion-salon{font-size:18px}.day-btn{min-height:49px}.day-num{font-size:18px}}

<div class="input-group" style="margin-top:18px"><input type="email" id="emailInput" placeholder="Tu correo electrónico"></div>

<div class="admin-section"><h3>CALENDARIO DE DISPONIBILIDAD</h3><div class="calendar-box"><div id="tituloCalendario" class="calendar-title">Hoy + 14 días</div><div class="calendar-grid" id="calendarioDias"></div><div class="calendar-legend"><span>● Disponible</span><span>● No disponible</span></div></div></div>
<div class="admin-section"><h3>AGENDA DEL DÍA</h3><input type="date" id="fechaAgendaAdmin"><div id="resumenAgenda" style="display:flex;gap:7px;margin-top:10px"></div><div id="listaTurnosAdmin" style="margin-top:10px"></div></div>

<div id="modalServicio" class="modal-backdrop hidden"><div class="modal"><h3>Agregar Servicio</h3><div class="input-group"><label>Nombre</label><input id="servicioNombreInput"></div><div class="input-group"><label>Precio</label><input id="servicioPrecioInput" type="number" min="0"></div><div class="modal-actions"><button class="btn-secondary" onclick="cerrarModal('modalServicio')">Cancelar</button><button class="btn-primary" onclick="guardarServicio()">Guardar</button></div></div></div>
<div id="modalTurno" class="modal-backdrop hidden"><div class="modal"><h3>Agregar Turno</h3><div class="input-group"><label>Cliente</label><select id="turnoClienteInput"></select></div><div class="input-group"><label>Servicio</label><select id="turnoServicioInput"></select></div><div class="input-group"><label>Fecha</label><input id="turnoFechaInput" type="date"></div><div class="input-group"><label>Hora</label><select id="turnoHoraInput"></select></div><div class="modal-actions"><button class="btn-secondary" onclick="cerrarModal('modalTurno')">Cancelar</button><button class="btn-primary" onclick="guardarTurnoAdmin()">Guardar</button></div></div></div>
<div id="modalEditarTurno" class="modal-backdrop hidden"><div class="modal"><h3>Editar Turno</h3><input type="hidden" id="editarTurnoId"><div class="input-group"><label>Cliente</label><select id="editarTurnoCliente"></select></div><div class="input-group"><label>Servicio</label><select id="editarTurnoServicio"></select></div><div class="input-group"><label>Fecha</label><input id="editarTurnoFecha" type="date"></div><div class="input-group"><label>Hora</label><select id="editarTurnoHora"></select></div><div class="modal-actions"><button class="btn-secondary" onclick="cerrarModal('modalEditarTurno')">Cancelar</button><button class="btn-primary" onclick="guardarEdicionTurno()">Guardar</button></div><button class="btn-danger" style="margin-top:8px" onclick="cancelarTurnoActual()">Cancelar Turno</button></div></div>
<script>
let usuarioActual=null,servicioSeleccionadoId=null,horaSeleccionada=null,todosLosTurnos=[],diasBloqueados=[],intervaloTiempoReal=null,agendaConfirmada=false,serviciosActuales=[],clientesActuales=[],cantidadTurnosLeidos=Number(localStorage.getItem('turnosLeidos'))||0;
const CORREO_BARBERO='gamarramartin1995@gmail.com',HORAS_LABORALES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'],MAX_DIAS=14;
function valoresArgentina(){const p=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());return Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]))}
function obtenerFechaHoraArgentina(){const v=valoresArgentina();return `${v.year}-${v.month}-${v.day} ${v.hour}:${v.minute}`}
function obtenerFechaArgentina(){return obtenerFechaHoraArgentina().slice(0,10)}
function fechaMasDias(n){const d=new Date(`${obtenerFechaArgentina()}T00:00:00`);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function diasEntre(a,b){return Math.round((new Date(`${b}T00:00:00`)-new Date(`${a}T00:00:00`))/86400000)}
function esDentroVentana(f){const d=diasEntre(obtenerFechaArgentina(),f);return d>=0&&d<=MAX_DIAS}
function horarioYaPaso(f,h){return `${f} ${h}`<=obtenerFechaHoraArgentina()}
function normalizarFechaHora(v){if(typeof v!=='string')return '';const s=v.trim().replace('T',' '),m=s.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2})/);return m?m[1]:s}
function precio(v){return `$${Number(v).toLocaleString('es-AR')}`}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function fetchTurnosGlobales(){try{const t=Date.now(),r=await Promise.all([fetch(`/api/turnos?t=${t}`,{cache:'no-store'}),fetch(`/api/dias-bloqueados?t=${t}`,{cache:'no-store'})]);if(!r[0].ok||!r[1].ok)throw new Error();const turnos=await r[0].json(),dias=await r[1].json();todosLosTurnos=Array.isArray(turnos)?turnos.map(x=>({...x,fecha_hora:normalizarFechaHora(x.fecha_hora)})):[];diasBloqueados=Array.isArray(dias)?dias:[];agendaConfirmada=true;return true}catch(e){agendaConfirmada=false;return false}}
async function loginTradicional(){const email=document.getElementById('emailInput').value.trim(),nombre=document.getElementById('nombreInput').value.trim();if(!email||!nombre)return alert('Completa tus datos.');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,nombre})}),d=await r.json();if(!r.ok)return alert(d.error||'No se pudo iniciar sesión.');localStorage.setItem('usuarioActivo',JSON.stringify(d));usuarioActual=d;await fetchTurnosGlobales();mostrarDashboard(d)}catch(e){alert('Error al conectar con el servidor.')}}
async function mostrarDashboard(u){document.getElementById('loginView').classList.add('hidden');document.getElementById('dashboardView').classList.remove('hidden');const admin=u.rol==='barbero'&&u.email.toLowerCase()===CORREO_BARBERO;document.getElementById('welcomeUser').innerText=admin?`Maestro ${u.nombre}`:`Bienvenido ${u.nombre}`;document.getElementById('seccionCliente').classList.toggle('hidden',admin);document.getElementById('seccionBarbero').classList.toggle('hidden',!admin);document.getElementById('btnNotificaciones').classList.toggle('hidden',!admin);if(admin){document.getElementById('fechaAgendaAdmin').value=obtenerFechaArgentina();document.getElementById('fechaBloqueo').min=obtenerFechaArgentina();document.getElementById('fechaBloqueo').max=fechaMasDias(MAX_DIAS);await cargarPanelBarbero();renderCalendario()}else{const f=document.getElementById('fechaInput');f.min=obtenerFechaArgentina();f.max=fechaMasDias(MAX_DIAS);await cargarServiciosCliente()}iniciarActualizacionTiempoReal()}
async function cargarServiciosCliente(){try{const r=await fetch('/api/servicios',{cache:'no-store'});serviciosActuales=await r.json();renderServiciosCliente()}catch(e){}}
function renderServiciosCliente(){const c=document.getElementById('contenedorServicios');c.innerHTML='';serviciosActuales.forEach((s,i)=>{const b=document.createElement('div');b.className=`btn-servicio ${i===0?'seleccionado':''}`;b.innerHTML=`<span>${escapeHtml(s.nombre)}</span><small>${precio(s.precio)}</small>`;b.onclick=()=>{document.querySelectorAll('.btn-servicio').forEach(x=>x.classList.remove('seleccionado'));b.classList.add('seleccionado');servicioSeleccionadoId=s.id};if(i===0)servicioSeleccionadoId=s.id;c.appendChild(b)})}
function cargarHorarios(){const f=document.getElementById('fechaInput').value,c=document.getElementById('contenedorHorarios'),g=document.getElementById('grillaHorarios');if(!f)return;c.style.display='block';g.innerHTML='';horaSeleccionada=null;if(!agendaConfirmada)return pintarNoDisponibles('NO DISPONIBLE');if(!esDentroVentana(f))return pintarNoDisponibles('FUERA DE AGENDA');if(diasBloqueados.includes(f)){g.innerHTML='<div class="fecha-bloqueada" style="grid-column:1/-1">Este día no está disponible.</div>';return}HORAS_LABORALES.forEach(h=>{const fh=`${f} ${h}`,ocupado=todosLosTurnos.some(t=>t.estado==='confirmado'&&normalizarFechaHora(t.fecha_hora)===fh),v=horarioYaPaso(f,h),b=document.createElement('div');if(v){b.className='btn-hora hora-vencida';b.innerHTML=`${h}<span>VENCIDO</span>`}else if(ocupado){b.className='btn-hora hora-ocupada';b.innerHTML=`${h}<span>OCUPADO</span>`}else{b.className='btn-hora hora-disponible';b.innerHTML=`${h}<span>LIBRE</span>`;b.onclick=()=>{document.querySelectorAll('.btn-hora').forEach(x=>x.classList.remove('seleccionada'));b.classList.add('seleccionada');horaSeleccionada=h}}g.appendChild(b)})}
function pintarNoDisponibles(text){const g=document.getElementById('grillaHorarios');HORAS_LABORALES.forEach(h=>{const b=document.createElement('div');b.className='btn-hora hora-no-disponible';b.innerHTML=`${h}<span>${text}</span>`;g.appendChild(b)})}
async function reservarTurno(){const f=document.getElementById('fechaInput').value;if(!f||!horaSeleccionada||!servicioSeleccionadoId)return alert('Selecciona una fecha y un horario libre.');const b=document.getElementById('btnConfirmarReserva');b.disabled=true;b.innerText='Verificando...';try{if(!(await fetchTurnosGlobales()))throw new Error();const fh=`${f} ${horaSeleccionada}`;if(!esDentroVentana(f)||diasBloqueados.includes(f)||horarioYaPaso(f,horaSeleccionada))return alert('Ese horario ya no está disponible.');if(todosLosTurnos.some(t=>t.estado==='confirmado'&&normalizarFechaHora(t.fecha_hora)===fh)){await fetchTurnosGlobales();cargarHorarios();return alert('Ese horario ya está ocupado.')}const r=await fetch('/api/turnos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cliente_id:usuarioActual.id,servicios_id:servicioSeleccionadoId,fecha_hora:fh})}),d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'No se pudo reservar.');await fetchTurnosGlobales();cargarHorarios();return}alert('¡Reserva confirmada!');await fetchTurnosGlobales();cargarHorarios()}catch(e){alert('No se pudo verificar la agenda.')}finally{b.disabled=false;b.innerText='Confirmar Reserva'}}
function iniciarActualizacionTiempoReal(){clearInterval(intervaloTiempoReal);intervaloTiempoReal=setInterval(async()=>{if(!usuarioActual)return;if(await fetchTurnosGlobales()){const f=document.getElementById('fechaInput');if(f&&!document.getElementById('seccionCliente').classList.contains('hidden')&&f.value)cargarHorarios();const a=document.getElementById('fechaAgendaAdmin');if(a&&!document.getElementById('seccionBarbero').classList.contains('hidden')&&a.value)cargarAgendaBarbero();if(!document.getElementById('seccionBarbero').classList.contains('hidden'))renderCalendario()}},5000)}
async function cargarPanelBarbero(){await cargarServiciosAdmin();await cargarClientesAdmin();cargarAgendaBarbero()}
async function cargarServiciosAdmin(){const r=await fetch('/api/servicios',{cache:'no-store'});serviciosActuales=await r.json();const c=document.getElementById('listaPreciosAdmin');c.innerHTML='';serviciosActuales.forEach(s=>{c.innerHTML+=`<div class="admin-card"><div class="admin-row"><input id="nombreServicio_${s.id}" value="${escapeHtml(s.nombre)}"><input id="precioServicio_${s.id}" type="number" min="0" value="${Number(s.precio)}"><button class="btn-primary btn-mini" onclick="editarServicio(${s.id})">Guardar</button></div></div>`})}
async function cargarClientesAdmin(){try{const r=await fetch('/api/clientes',{cache:'no-store'});if(!r.ok)throw new Error();clientesActuales=await r.json()}catch(e){clientesActuales=[]}}
function cargarAgendaBarbero(){const f=document.getElementById('fechaAgendaAdmin').value,c=document.getElementById('listaTurnosAdmin'),r=document.getElementById('resumenAgenda');if(!f)return;if(diasBloqueados.includes(f)){r.innerHTML='';c.innerHTML='<div class="fecha-bloqueada">Día no disponible.</div>';return}let l=0,o=0,v=0,html='';HORAS_LABORALES.forEach(h=>{const fh=`${f} ${h}`,t=todosLosTurnos.find(x=>x.estado==='confirmado'&&normalizarFechaHora(x.fecha_hora)===fh),vp=horarioYaPaso(f,h);if(t){o++;html+=`<div class="admin-card"><div class="admin-card-head"><div><div class="admin-card-title">${h} · OCUPADO</div><div class="admin-card-meta">${escapeHtml(t.cliente)} · ${escapeHtml(t.servicio)}</div></div><button class="btn-primary btn-mini" onclick="abrirEditarTurno(${t.id})">Editar</button></div><div class="admin-actions"><button class="btn-danger btn-mini" onclick="cancelarTurno(${t.id})">Cancelar</button></div></div>`}else if(vp){v++;html+=`<div class="admin-card"><div class="admin-card-title" style="color:#e46860">${h} · VENCIDO</div></div>`}else{l++;html+=`<div class="admin-card"><div class="admin-card-head"><div class="admin-card-title" style="color:#42d37f">${h} · LIBRE</div><button class="btn-primary btn-mini" onclick="abrirModalTurno('${f}','${h}')">+</button></div></div>`}});r.innerHTML=`<div class="btn-secondary btn-mini">🟩 ${l}</div><div class="btn-danger btn-mini">🟥 ${o}</div><div class="btn-secondary btn-mini">⏱ ${v}</div>`;c.innerHTML=html}
function renderCalendario(){const c=document.getElementById('calendarioDias');if(!c)return;c.innerHTML='';const hoy=obtenerFechaArgentina(),base=new Date(`${hoy}T00:00:00`),nombres=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];for(let i=0;i<=14;i++){const d=new Date(base);d.setDate(base.getDate()+i);const f=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,bloq=diasBloqueados.includes(f),b=document.createElement('button');b.className=`day-btn ${bloq?'blocked':'available'}`;b.innerHTML=`<span class="day-name">${nombres[d.getDay()]}</span><span class="day-num">${d.getDate()}</span><span class="day-state">${bloq?'NO DISP':'DISP'}</span>`;b.onclick=()=>{document.getElementById('fechaAgendaAdmin').value=f;document.getElementById('fechaBloqueo').value=f;cargarAgendaBarbero();renderCalendario()};c.appendChild(b)}}
async function bloquearDia(){const f=document.getElementById('fechaBloqueo').value;if(!f||!esDentroVentana(f))return alert('Selecciona uno de los próximos 14 días.');try{const r=await fetch('/api/admin/dias-bloqueados',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fecha:f})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo bloquear.');await fetchTurnosGlobales();cargarAgendaBarbero();renderCalendario()}catch(e){alert(e.message)}}
async function desbloquearDiaSeleccionado(){const f=document.getElementById('fechaBloqueo').value;if(!f)return alert('Selecciona una fecha.');try{const r=await fetch(`/api/admin/dias-bloqueados/${encodeURIComponent(f)}`,{method:'DELETE'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo habilitar.');await fetchTurnosGlobales();cargarAgendaBarbero();renderCalendario()}catch(e){alert(e.message)}}
function abrirModalServicio(){document.getElementById('servicioNombreInput').value='';document.getElementById('servicioPrecioInput').value='';document.getElementById('modalServicio').classList.remove('hidden')}
function cerrarModal(id){document.getElementById(id).classList.add('hidden')}
async function guardarServicio(){const n=document.getElementById('servicioNombreInput').value.trim(),p=document.getElementById('servicioPrecioInput').value;if(!n||p==='')return alert('Completa nombre y precio.');try{const r=await fetch('/api/admin/servicios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:n,precio:p})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo crear.');cerrarModal('modalServicio');await cargarPanelBarbero();await cargarServiciosCliente()}catch(e){alert(e.message)}}
async function editarServicio(id){const n=document.getElementById(`nombreServicio_${id}`).value.trim(),p=document.getElementById(`precioServicio_${id}`).value;if(!n||p==='')return alert('Completa los datos.');try{const r=await fetch(`/api/admin/servicios/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:n,precio:p})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo actualizar.');await cargarServiciosAdmin();await cargarServiciosCliente()}catch(e){alert(e.message)}}
async function prepararModales(){document.getElementById('turnoClienteInput').innerHTML=clientesActuales.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}${c.email?' - '+escapeHtml(c.email):''}</option>`).join('');document.getElementById('turnoServicioInput').innerHTML=serviciosActuales.map(s=>`<option value="${s.id}">${escapeHtml(s.nombre)} - ${precio(s.precio)}</option>`).join('');const h=HORAS_LABORALES.map(x=>`<option>${x}</option>`).join('');document.getElementById('turnoHoraInput').innerHTML=h;document.getElementById('editarTurnoHora').innerHTML=h;document.getElementById('editarTurnoCliente').innerHTML=document.getElementById('turnoClienteInput').innerHTML;document.getElementById('editarTurnoServicio').innerHTML=document.getElementById('turnoServicioInput').innerHTML}
async function abrirModalTurno(f,h){await prepararModales();document.getElementById('turnoFechaInput').min=obtenerFechaArgentina();document.getElementById('turnoFechaInput').max=fechaMasDias(MAX_DIAS);document.getElementById('turnoFechaInput').value=f;document.getElementById('turnoHoraInput').value=h;document.getElementById('modalTurno').classList.remove('hidden')}
async function guardarTurnoAdmin(){const p={cliente_id:document.getElementById('turnoClienteInput').value,servicios_id:document.getElementById('turnoServicioInput').value,fecha_hora:`${document.getElementById('turnoFechaInput').value} ${document.getElementById('turnoHoraInput').value}`};try{const r=await fetch('/api/admin/turnos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo agregar el turno.');cerrarModal('modalTurno');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
async function abrirEditarTurno(id){const t=todosLosTurnos.find(x=>x.id===id);if(!t)return;await prepararModales();const f=normalizarFechaHora(t.fecha_hora);document.getElementById('editarTurnoId').value=id;document.getElementById('editarTurnoCliente').value=t.clientes_id;document.getElementById('editarTurnoServicio').value=t.servicios_id;document.getElementById('editarTurnoFecha').min=obtenerFechaArgentina();document.getElementById('editarTurnoFecha').max=fechaMasDias(MAX_DIAS);document.getElementById('editarTurnoFecha').value=f.slice(0,10);document.getElementById('editarTurnoHora').value=f.slice(11,16);document.getElementById('modalEditarTurno').classList.remove('hidden')}
async function guardarEdicionTurno(){const id=document.getElementById('editarTurnoId').value,p={cliente_id:document.getElementById('editarTurnoCliente').value,servicios_id:document.getElementById('editarTurnoServicio').value,fecha_hora:`${document.getElementById('editarTurnoFecha').value} ${document.getElementById('editarTurnoHora').value}`};try{const r=await fetch(`/api/admin/turnos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo editar.');cerrarModal('modalEditarTurno');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
async function cancelarTurno(id){if(!confirm('¿Cancelar este turno?'))return;try{const r=await fetch(`/api/admin/turnos/${id}`,{method:'DELETE'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo cancelar.');cerrarModal('modalEditarTurno');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
function cancelarTurnoActual(){cancelarTurno(Number(document.getElementById('editarTurnoId').value))}
function revisarNotificaciones(){if(!usuarioActual||usuarioActual.rol!=='barbero')return;const b=document.getElementById('badgeNoti'),n=todosLosTurnos.filter(t=>t.estado==='confirmado').length-cantidadTurnosLeidos;if(n>0){b.innerText=n;b.classList.remove('hidden')}}
function verNotificaciones(){cantidadTurnosLeidos=todosLosTurnos.filter(t=>t.estado==='confirmado').length;localStorage.setItem('turnosLeidos',cantidadTurnosLeidos);document.getElementById('badgeNoti').classList.add('hidden')}
function cerrarSesion(){clearInterval(intervaloTiempoReal);localStorage.removeItem('usuarioActivo');location.href='/'}
document.getElementById('fechaInput').addEventListener('change',cargarHorarios);
document.getElementById('fechaAgendaAdmin').addEventListener('change',cargarAgendaBarbero);
window.onload=async()=>{const u=localStorage.getItem('usuarioActivo');if(u)try{usuarioActual=JSON.parse(u);await fetchTurnosGlobales();await mostrarDashboard(usuarioActual)}catch(e){localStorage.removeItem('usuarioActivo')}};
</script>
</body>
