<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excelencia - Barbería de Autor</title>
    <!-- Favicon del Logo (Polo de Barbero con la E dorada) -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0b0b'/><path d='M40 20h20v60H40z' fill='%23ffffff'/><path d='M50 20h10v60H50z' fill='%230033a0'/><path d='M30 20h10v60H30z' fill='%23d52b1e'/><text x='50' y='62' font-family='serif' font-size='42' font-weight='bold' fill='%23c5a059' text-anchor='middle'>E</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0b;
            color: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }
        /* Marco Tricolor Estilizado Adaptativo */
        .marco-tricolor {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            border: 6px solid transparent;
            background: linear-gradient(135deg, #0033a0 0%, #ffffff 50%, #d52b1e 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.85;
        }
        .main-container {
            width: 100%;
            max-width: 420px;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .header-title { text-align: center; margin-bottom: 20px; }
        .header-title h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #c5a059;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .header-title p {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .btn-social {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            transition: background 0.2s;
        }
        .btn-google { background: #ffffff; color: #1f1f1f; }
        .btn-google:hover { background: #e0e0e0; }
        .divisor {
            margin: 18px 0;
            border-top: 1px solid #262626;
            position: relative;
            text-align: center;
        }
        .divisor span {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            background: #141414;
            padding: 0 10px;
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
        }
        .input-group { margin-bottom: 14px; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 14px;
            background: #1f1f1f;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #c5a059;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #c5a059;
            color: #0b0b0b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #b08d48; }
        .hidden { display: none !important; }
        .dashboard-view { text-align: left; }
        .dashboard-view h2 { color: #c5a059; margin-bottom: 8px; font-size: 20px; }
        .welcome-msg { font-size: 13px; color: #aaa; margin-bottom: 15px; }
        
        /* Adaptabilidad móvil estricta */
        @media (max-width: 480px) {
            .main-container { padding: 20px 15px; }
            .header-title h1 { font-size: 42px; }
        }
    </style>
</head>
<body>

    <div class="marco-tricolor"></div>

    <div class="main-container">
        <!-- VISTA DE LOGIN -->
        <div id="loginView">
            <div class="header-title">
                <h1>Excelencia</h1>
                <p>Barbería de Autor</p>
            </div>

            <!-- Botón Real de Google OAuth -->
            <button class="btn-social btn-google" onclick="window.location.href='/auth/google'">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Continuar con Google
            </button>

            <div class="divisor">
                <span>o acceso institucional</span>
            </div>

            <div class="input-group">
                <input type="email" id="emailInput" placeholder="Correo electrónico">
            </div>
            <div class="input-group">
                <input type="text" id="nombreInput" placeholder="Nombre completo">
            </div>
            <button class="btn-primary" onclick="loginTradicional()">Ingresar al Sistema</button>
        </div>

        <!-- VISTA DE CLIENTE (RESERVA DE TURNOS) -->
        <div id="dashboardView" class="dashboard-view hidden">
            <h2 id="tituloPanel">Panel de Citas</h2>
            <p id="welcomeUser" class="welcome-msg"></p>
            
            <div id="seccionCliente">
                <div class="input-group">
                    <label style="font-size: 12px; color: #888; display: block; margin-bottom: 5px;">Selecciona un Servicio:</label>
                    <select id="selectServicios">
                        <option value="">Cargando servicios...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label style="font-size: 12px; color: #888; display: block; margin-bottom: 5px;">Fecha y Hora:</label>
                    <input type="datetime-local" id="fechaHoraInput">
                </div>

                <button class="btn-primary" onclick="reservarTurno()">Reservar Turno</button>
            </div>

            <!-- VISTA EXCLUSIVA PARA EL BARBERO (Gamarramartin1995@gmail.com) -->
            <div id="seccionBarbero" class="hidden">
                <div style="background: #1f1f1f; padding: 15px; border-radius: 8px; border-left: 4px solid #c5a059; margin-bottom: 15px;">
                    <p style="font-size: 14px; color: #c5a059; font-weight: bold; margin-bottom: 5px;">Modo Administrador / Barbero</p>
                    <p style="font-size: 12px; color: #bbb;">Aquí tienes el control maestro de la barbería Excelencia. Los turnos agendados por los clientes se registrarán en la base de datos cloud.</p>
                </div>
            </div>

            <button class="btn-primary" onclick="cerrarSesion()" style="background: #333; color: #fff; margin-top: 15px;">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        let usuarioActual = null;
        const CORREO_BARBERO = "gamarramartin1995@gmail.com";

        window.onload = async function() {
            const userStored = localStorage.getItem('usuarioActivo');
            if (userStored) {
                usuarioActual = JSON.parse(userStored);
                mostrarDashboard(usuarioActual);
            }
        };

        async function loginTradicional() {
            const email = document.getElementById('emailInput').value.trim();
            const nombre = document.getElementById('nombreInput').value.trim();

            if (!email || !nombre) {
                alert("Completa ambos campos.");
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, nombre })
                });
                const data = await res.json();
                if (res.ok) {
                    usuarioActual = data;
                    localStorage.setItem('usuarioActivo', JSON.stringify(data));
                    mostrarDashboard(data);
                } else {
                    alert("Error al iniciar sesión.");
                }
            } catch (err) {
                alert("Error de conexión con el servidor.");
            }
        }

        async function mostrarDashboard(user) {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            
            const esBarbero = user.email && user.email.toLowerCase().trim() === CORREO_BARBERO;
            
            if (esBarbero) {
                document.getElementById('tituloPanel').innerText = "Panel del Barbero";
                document.getElementById('welcomeUser').innerText = `Maestro Barber: ${user.nombre} (ADMINISTRADOR)`;
                document.getElementById('seccionCliente').classList.add('hidden');
                document.getElementById('seccionBarbero').classList.remove('hidden');
            } else {
                document.getElementById('tituloPanel').innerText = "Panel de Citas";
                document.getElementById('welcomeUser').innerText = `Bienvenido, ${user.nombre} (Cliente)`;
                document.getElementById('seccionBarbero').classList.add('hidden');
                document.getElementById('seccionCliente').classList.remove('hidden');
                
                // Cargar servicios desde PostgreSQL
                try {
                    const res = await fetch('/api/servicios');
                    const servicios = await res.json();
                    const select = document.getElementById('selectServicios');
                    select.innerHTML = '';
                    servicios.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.textContent = `${s.nombre} - $${s.precio}`;
                        select.appendChild(opt);
                    });
                } catch (err) {
                    console.error("Error al cargar servicios");
                }
            }
        }

        async function reservarTurno() {
            const servicioId = document.getElementById('selectServicios').value;
            const fechaHora = document.getElementById('fechaHoraInput').value;

            if (!fechaHora || !servicioId) {
                alert("Selecciona un servicio y una fecha/hora.");
                return;
            }

            try {
                const res = await fetch('/api/turnos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cliente_id: usuarioActual.id,
                        servicios_id: servicioId,
                        fecha_hora: fechaHora
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("¡Turno reservado con éxito en la base de datos de la barbería!");
                    document.getElementById('fechaHoraInput').value = '';
                } else {
                    alert("Error al guardar el turno.");
                }
            } catch (err) {
                alert("Error de conexión al reservar.");
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioActivo');
            window.location.href = '/';
        }
    </script>
</body>
</html>
