ckdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:10000;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:100%;max-width:420px;background:#121212;border:1px solid #333;border-radius:16px;padding:18px;box-shadow:0 20px 60px #000}.modal h3{color:#c5a059;margin-bottom:14px;font-size:16px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions>*{flex:1}.firma-naicky{margin-top:28px;text-align:center;font-family:'Allura',cursive;font-style:normal;font-size:24px;color:#555;letter-spacing:1px;user-select:none}.firma-naicky:after{content:' ®';font-family:'Allura',cursive;font-size:8px;vertical-align:super;font-style:normal;letter-spacing:0}@media(max-width:480px){body{padding:0}.main-container{padding:28px 18px;border-radius:0;min-height:100vh;border:none}.marca-excelencia h1{font-size:44px}.horarios-grid{gap:7px}}

<script>
let usuarioActual=null,servicioSeleccionadoId=null,horaSeleccionada=null,todosLosTurnos=[],diasBloqueados=[],agendaConfirmada=false,intervaloTiempoReal=null;
const CORREO_BARBERO='gamarramartin1995@gmail.com',HORAS_LABORALES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
function obtenerFechaArgentina(){const ahora=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(ahora)}
function fechaMasDias(n){const d=new Date(obtenerFechaArgentina()+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esDentroVentana(f){return f>=obtenerFechaArgentina()&&f<=fechaMasDias(14)}
function normalizarFechaHora(v){if(!v)return '';const d=new Date(v);if(!Number.isNaN(d.getTime()))return new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d).replace('T',' ');return v.slice(0,16)}
function horarioYaPaso(fecha,hora){const hoy=obtenerFechaArgentina();if(fecha!==hoy)return fecha<hoy;const ahora=new Date();const local=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(ahora).replace('T',' ');return local>=`${fecha} ${hora}`}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function fetchTurnosGlobales(){try{const ts=Date.now(),[rt,rd]=await Promise.all([fetch(`/api/turnos?t=${ts}`,{cache:'no-store'}),fetch(`/api/dias-bloqueados?t=${ts}`,{cache:'no-store'})]);if(!rt.ok||!rd.ok)throw new Error('No se pudo sincronizar la agenda.');const [turnos,dias]=await Promise.all([rt.json(),rd.json()]);todosLosTurnos=Array.isArray(turnos)?turnos.map(t=>({...t,fecha_hora:normalizarFechaHora(t.fecha_hora)})):[];diasBloqueados=Array.isArray(dias)?dias:[];agendaConfirmada=true;return true}catch(e){agendaConfirmada=false;console.error(e);return false}}
async function cargarServiciosCliente(){try{const r=await fetch('/api/servicios?t='+Date.now(),{cache:'no-store'}),s=await r.json(),c=document.getElementById('contenedorServicios');c.innerHTML='';s.forEach(x=>{const b=document.createElement('button');b.className='btn-servicio';b.innerHTML=`<span>${escapeHtml(x.nombre)}</span><small>$${Number(x.precio).toLocaleString('es-AR')}</small>`;b.onclick=()=>{document.querySelectorAll('.btn-servicio').forEach(y=>y.classList.remove('seleccionado'));b.classList.add('seleccionado');servicioSeleccionadoId=x.id};c.appendChild(b)})}catch(e){console.error(e)}}
async function loginTradicional(){const email=document.getElementById('emailInput').value.trim().toLowerCase(),nombre=document.getElementById('nombreInput').value.trim();if(!email||!nombre)return alert('Completa tu nombre y correo.');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,nombre})}),u=await r.json();if(!r.ok)throw new Error(u.error||'No se pudo ingresar.');usuarioActual=u;localStorage.setItem('usuarioActivo',JSON.stringify(u));await fetchTurnosGlobales();await mostrarDashboard(u)}catch(e){alert(e.message)}}
async function mostrarDashboard(user){document.getElementById('loginView').classList.add('hidden');document.getElementById('dashboardView').classList.remove('hidden');const esBarbero=user.email.toLowerCase()===CORREO_BARBERO&&user.rol==='barbero'&&user.rol==='barbero';document.getElementById('welcomeUser').innerText=esBarbero?`Maestro Autor: ${user.nombre}`:`Cliente VIP: ${user.nombre}`;document.getElementById('seccionCliente').classList.toggle('hidden',esBarbero);document.getElementById('seccionBarbero').classList.toggle('hidden',!esBarbero);document.getElementById('btnNotificaciones').classList.toggle('hidden',!esBarbero);if(esBarbero){const a=document.getElementById('fechaAgendaAdmin');a.value=a.value||obtenerFechaArgentina();document.getElementById('fechaBloqueo').min=obtenerFechaArgentina();await cargarPanelBarbero();renderCalendario()}else{const f=document.getElementById('fechaInput');f.min=obtenerFechaArgentina();f.max=fechaMasDias(14);await cargarServiciosCliente();renderCalendarioCliente()}iniciarActualizacionTiempoReal()}
function cargarHorarios(){const fecha=document.getElementById('fechaInput').value,c=document.getElementById('contenedorHorarios'),g=document.getElementById('grillaHorarios');if(!fecha)return;c.style.display='block';g.innerHTML='';horaSeleccionada=null;if(!agendaConfirmada)return renderNoDisponibles('NO DISPONIBLE');if(!esDentroVentana(fecha))return renderNoDisponibles('FUERA DE AGENDA');if(diasBloqueados.includes(fecha)){g.innerHTML='<div class="fecha-bloqueada" style="grid-column:1/-1">El Maestro Barbero no atenderá este día.</div>';return}HORAS_LABORALES.forEach(h=>{const fh=`${fecha} ${h}`,ocupado=todosLosTurnos.some(t=>normalizarFechaHora(t.fecha_hora)===fh&&t.estado!=='cancelado'),vencido=horarioYaPaso(fecha,h),b=document.createElement('div');if(vencido){b.className='btn-hora hora-vencida';b.innerHTML=`${h}<span>VENCIDO</span>`}else if(ocupado){b.className='btn-hora hora-ocupada';b.innerHTML=`${h}<span>OCUPADO</span>`}else{b.className='btn-hora hora-disponible';b.innerHTML=`${h}<span>LIBRE</span>`;b.onclick=()=>{document.querySelectorAll('.btn-hora').forEach(x=>x.classList.remove('seleccionada'));b.classList.add('seleccionada');horaSeleccionada=h}}g.appendChild(b)});let i=document.getElementById('indicadorTiempoReal');if(!i){i=document.createElement('div');i.id='indicadorTiempoReal';i.className='estado-tiempo-real';c.appendChild(i)}i.innerText='● Agenda actualizada'}
function renderNoDisponibles(txt){const g=document.getElementById('grillaHorarios');g.innerHTML='';const b=document.createElement('div');b.className='fecha-bloqueada';b.style.gridColumn='1/-1';b.innerText=txt;g.appendChild(b)}
async function reservarTurno(){const fecha=document.getElementById('fechaInput').value;if(!fecha||!horaSeleccionada||!servicioSeleccionadoId)return alert('Selecciona una fecha y un horario libre.');const b=document.getElementById('btnConfirmarReserva');b.disabled=true;b.innerText='Verificando...';try{if(!(await fetchTurnosGlobales()))throw new Error('agenda');const fh=`${fecha} ${horaSeleccionada}`;if(!esDentroVentana(fecha)||diasBloqueados.includes(fecha)||horarioYaPaso(fecha,horaSeleccionada))return alert('Ese horario ya no está disponible.');if(todosLosTurnos.some(t=>normalizarFechaHora(t.fecha_hora)===fh&&t.estado!=='cancelado')){await fetchTurnosGlobales();cargarHorarios();return alert('Ese turno ya está ocupado. Elige otro horario verde.')}const r=await fetch('/api/turnos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cliente_id:usuarioActual.id,servicios_id:servicioSeleccionadoId,fecha_hora:fh})});const d=await r.json().catch(()=>({}));if(r.ok){alert('¡Reserva confirmada con éxito en Excelencia!');await fetchTurnosGlobales();cargarHorarios()}else{alert(d.error||'No se pudo reservar el turno.');await fetchTurnosGlobales();cargarHorarios()}}catch(e){alert('No se pudo verificar la agenda. Intenta nuevamente.')}finally{b.disabled=false;b.innerText='Confirmar Reserva'}}
async function iniciarActualizacionTiempoReal(){clearInterval(intervaloTiempoReal);intervaloTiempoReal=setInterval(async()=>{if(!usuarioActual)return;if(await fetchTurnosGlobales()){const fc=document.getElementById('fechaInput'),sa=document.getElementById('seccionCliente');if(fc&&fc.value&&!sa.classList.contains('hidden')){cargarHorarios();renderCalendarioCliente()}const fa=document.getElementById('fechaAgendaAdmin'),sb=document.getElementById('seccionBarbero');if(fa&&fa.value&&!sb.classList.contains('hidden')){cargarAgendaBarbero();renderCalendario()}}},5000)}
function verNotificaciones(){alert('Las notificaciones se administrarán desde aquí.')}
async function cargarServiciosAdmin(){const r=await fetch('/api/servicios?t='+Date.now(),{cache:'no-store'}),s=await r.json(),c=document.getElementById('listaPreciosAdmin');c.innerHTML='';s.forEach(x=>{c.innerHTML+=`<div class="admin-card"><div class="admin-card-head"><div class="admin-card-title">${escapeHtml(x.nombre)}</div><div>$${Number(x.precio).toLocaleString('es-AR')}</div></div><div class="admin-actions"><button class="btn-primary btn-mini" onclick="editarServicio(${x.id},${JSON.stringify(x.nombre)},${x.precio})">Editar</button></div></div>`})}
async function cargarPanelBarbero(){await cargarServiciosAdmin();await cargarClientesAdmin();cargarAgendaBarbero()}
function cargarAgendaBarbero(){const fecha=document.getElementById('fechaAgendaAdmin').value,c=document.getElementById('listaTurnosAdmin'),r=document.getElementById('resumenAgenda');if(!fecha){c.innerHTML='';return}let libres=0,ocupados=0,vencidos=0,html='';if(diasBloqueados.includes(fecha)){r.innerHTML='';c.innerHTML='<div class="fecha-bloqueada">Día bloqueado. No se pueden tomar turnos.</div>';return}HORAS_LABORALES.forEach(h=>{const fh=`${fecha} ${h}`,t=todosLosTurnos.find(x=>normalizarFechaHora(x.fecha_hora)===fh&&x.estado!=='cancelado'),v=horarioYaPaso(fecha,h);if(t){ocupados++;html+=`<div class="admin-card"><div class="admin-card-head"><div><div class="admin-card-title">${h} · OCUPADO</div><div class="admin-card-meta">${escapeHtml(t.cliente||'Cliente')} · ${escapeHtml(t.servicio||'Servicio')}</div></div><button class="btn-primary btn-mini" onclick="abrirEditarTurno(${t.id})">Editar</button></div><div class="admin-actions"><button class="btn-danger btn-mini" onclick="cancelarTurno(${t.id})">Cancelar</button></div></div>`}else if(v){vencidos++;html+=`<div class="admin-card"><div class="admin-card-title" style="color:#ff4d4d">${h} · VENCIDO</div></div>`}else{libres++;html+=`<div class="admin-card"><div class="admin-card-head"><div><div class="admin-card-title" style="color:#2ecc71">${h} · LIBRE</div></div><button class="btn-primary btn-mini" onclick="abrirModalTurno('${fecha}','${h}')">+</button></div></div>`}});r.innerHTML=`<div class="btn-secondary btn-mini">🟩 ${libres}</div><div class="btn-danger btn-mini">🟥 ${ocupados}</div><div class="btn-secondary btn-mini">⏱ ${vencidos}</div>`;c.innerHTML=html}
function renderCalendarioCliente(){const c=document.getElementById('calendarioCliente'),t=document.getElementById('tituloCalendarioCliente');if(!c||!t)return;c.innerHTML='';const hoy=obtenerFechaArgentina(),base=new Date(hoy+'T00:00:00'),meses=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];t.innerText=meses[base.getMonth()]+' '+base.getFullYear();for(let i=0;i<base.getDay();i++){const e=document.createElement('div');e.className='empty';c.appendChild(e)}for(let i=0;i<15;i++){const d=new Date(base);d.setDate(base.getDate()+i);const f=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),b=document.createElement('button'),bloq=diasBloqueados.includes(f);b.type='button';b.className='client-day '+(bloq?'blocked':'available')+(document.getElementById('fechaInput').value===f?' selected':'');b.innerHTML='<span class="client-day-name">'+['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][d.getDay()]+'</span><span class="client-day-num">'+d.getDate()+'</span><span class="client-day-state">'+(bloq?'NO DISP':'LIBRE')+'</span>';b.onclick=()=>{if(bloq)return;selectClientDate(f)};c.appendChild(b)}}
function selectClientDate(f){document.getElementById('fechaInput').value=f;renderCalendarioCliente();cargarHorarios()}
function renderCalendario(){const c=document.getElementById('calendarioDias');if(!c)return;c.innerHTML='';const hoy=obtenerFechaArgentina();const base=new Date(`${hoy}T00:00:00`);const nombres=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];for(let i=0;i<15;i++){const d=new Date(base);d.setDate(base.getDate()+i);const f=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,bloq=diasBloqueados.includes(f),b=document.createElement('button');b.className=`day-btn ${bloq?'blocked':'available'}`;b.innerHTML=`<span class="day-name">${nombres[d.getDay()]}</span><span class="day-num">${d.getDate()}</span><span class="day-state">${bloq?'NO DISP':'DISP'}</span>`;b.onclick=()=>{document.getElementById('fechaAgendaAdmin').value=f;document.getElementById('fechaBloqueo').value=f;cargarAgendaBarbero();renderCalendario()};c.appendChild(b)}}
async function cargarClientesAdmin(){try{const r=await fetch('/api/clientes?t='+Date.now(),{cache:'no-store'}),clientes=await r.json();window.clientesAdmin=clientes}catch(e){console.error(e)}}
function abrirModalServicio(){document.getElementById('tituloModalServicio').innerText='Agregar Servicio';document.getElementById('servicioNombreInput').value='';document.getElementById('servicioPrecioInput').value='';document.getElementById('modalServicio').classList.remove('hidden')}
function editarServicio(id,nombre,precio){document.getElementById('tituloModalServicio').innerText='Editar Servicio';document.getElementById('servicioNombreInput').value=nombre;document.getElementById('servicioPrecioInput').value=precio;document.getElementById('modalServicio').classList.remove('hidden');window.editandoServicio=id}
async function guardarServicio(){const nombre=document.getElementById('servicioNombreInput').value.trim(),precio=Number(document.getElementById('servicioPrecioInput').value);if(!nombre||precio<0)return alert('Completa nombre y precio.');try{const editando=window.editandoServicio;const r=await fetch(editando?`/api/admin/servicios/${editando}`:'/api/admin/servicios',{method:editando?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,precio})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo guardar.');window.editandoServicio=null;cerrarModal('modalServicio');await cargarServiciosAdmin()}catch(e){alert(e.message)}}
async function prepararModales(){const c=window.clientesAdmin||[],r=await fetch('/api/servicios?t='+Date.now(),{cache:'no-store'}),s=await r.json();['turnoClienteInput','editarTurnoCliente'].forEach(id=>{const x=document.getElementById(id);x.innerHTML=c.map(v=>`<option value="${v.id}">${escapeHtml(v.nombre)} · ${escapeHtml(v.email)}</option>`).join('')});['turnoServicioInput','editarTurnoServicio'].forEach(id=>{const x=document.getElementById(id);x.innerHTML=s.map(v=>`<option value="${v.id}">${escapeHtml(v.nombre)} · $${Number(v.precio).toLocaleString('es-AR')}</option>`).join('')});['turnoHoraInput','editarTurnoHora'].forEach(id=>{const x=document.getElementById(id);x.innerHTML=HORAS_LABORALES.map(h=>`<option value="${h}">${h}</option>`).join('')})}
async function abrirModalTurno(fecha,hora){await prepararModales();document.getElementById('turnoFechaInput').value=fecha;document.getElementById('turnoHoraInput').value=hora;document.getElementById('modalTurno').classList.remove('hidden')}
async function guardarTurnoAdmin(){const payload={cliente_id:document.getElementById('turnoClienteInput').value,servicios_id:document.getElementById('turnoServicioInput').value,fecha_hora:`${document.getElementById('turnoFechaInput').value} ${document.getElementById('turnoHoraInput').value}`};try{const r=await fetch('/api/turnos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo agregar el turno.');cerrarModal('modalTurno');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
async function abrirEditarTurno(id){const t=todosLosTurnos.find(x=>x.id===id);if(!t)return;await prepararModales();document.getElementById('editarTurnoId').value=id;document.getElementById('editarTurnoCliente').value=t.clientes_id;document.getElementById('editarTurnoServicio').value=t.servicios_id;document.getElementById('editarTurnoFecha').value=normalizarFechaHora(t.fecha_hora).slice(0,10);document.getElementById('editarTurnoHora').value=normalizarFechaHora(t.fecha_hora).slice(11,16);document.getElementById('modalEditarTurno').classList.remove('hidden')}
async function guardarEdicionTurno(){const id=document.getElementById('editarTurnoId').value,payload={cliente_id:document.getElementById('editarTurnoCliente').value,servicios_id:document.getElementById('editarTurnoServicio').value,fecha_hora:`${document.getElementById('editarTurnoFecha').value} ${document.getElementById('editarTurnoHora').value}`};try{const r=await fetch(`/api/admin/turnos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'El servidor todavía debe habilitar la edición.');cerrarModal('modalEditarTurno');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
async function cancelarTurno(id){if(!confirm('¿Cancelar este turno?'))return;try{const r=await fetch(`/api/admin/turnos/${id}`,{method:'DELETE'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo cancelar.');await fetchTurnosGlobales();cargarAgendaBarbero()}catch(e){alert(e.message)}}
function cancelarTurnoActual(){const id=document.getElementById('editarTurnoId').value;cerrarModal('modalEditarTurno');cancelarTurno(id)}
async function bloquearDia(){const f=document.getElementById('fechaBloqueo').value;if(!f)return alert('Selecciona una fecha.');if(!esDentroVentana(f))return alert('Solo puedes organizar los próximos 14 días.');try{const r=await fetch('/api/admin/dias-bloqueados',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fecha:f})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo bloquear');await fetchTurnosGlobales();document.getElementById('fechaAgendaAdmin').value=f;cargarAgendaBarbero();renderCalendario()}catch(e){alert(e.message)}}
async function desbloquearDiaSeleccionado(){const f=document.getElementById('fechaBloqueo').value;if(!f)return alert('Selecciona una fecha.');try{const r=await fetch(`/api/admin/dias-bloqueados/${encodeURIComponent(f)}`,{method:'DELETE',credentials:'same-origin'});if(!r.ok)throw new Error();await fetchTurnosGlobales();renderCalendario();cargarAgendaBarbero()}catch(e){alert('El servidor todavía debe habilitar la función de desbloqueo.')}}
function cerrarModal(id){document.getElementById(id).classList.add('hidden')}
function cerrarSesion(){localStorage.removeItem('usuarioActivo');location.reload()}
document.getElementById('fechaInput').addEventListener('change',cargarHorarios);
window.onload=async()=>{const hoy=obtenerFechaArgentina();document.getElementById('fechaInput').min=hoy;document.getElementById('fechaInput').max=fechaMasDias(14);document.getElementById('fechaBloqueo').min=hoy;renderCalendarioCliente();const u=localStorage.getItem('usuarioActivo');if(u)try{usuarioActual=JSON.parse(u);await fetchTurnosGlobales();await mostrarDashboard(usuarioActual)}catch(e){console.error(e)}};
</script>
</body>
